---
  on:
    push:
      tags:
      - v*.*.*
    workflow_dispatch:
      inputs:
        tag:
          description: Existing tag to (re-)publish, e.g. v1.0.0
          required: true
          type: string

  name: Build and push gem
  jobs:
    push:
      runs-on: ubuntu-latest
      permissions:
        contents: write
        id-token: write
      steps:
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
        with:
          role-to-assume: rg_oidc_akr_mrgtcg38wgdnv4n9vvyj
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Set remote URL
        run: |
          # Attribute commits to the last committer on HEAD
          git config --global user.email "$(git log -1 --pretty=format:'%ae')"
          git config --global user.name "$(git log -1 --pretty=format:'%an')"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY"
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: false
          ruby-version: ruby
      - name: Install dependencies
        run: bundle install
      - name: Extract version number
        run: echo "GEM_VERSION=${TAG#v}" >> $GITHUB_ENV
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
      - name: Release
        run: bundle exec rake release
      - name: Wait for release to propagate
        run: |
          gem install rubygems-await
          gem_tuple="$(ruby -rbundler/setup -rbundler -e '
              spec = Bundler.definition.specs.find {|s| s.name == ARGV[0] }
              raise "No spec for #{ARGV[0]}" unless spec
              print [spec.name, spec.version, spec.platform].join(":")
            ' "jwk-loader")"
          gem await "${gem_tuple}"
